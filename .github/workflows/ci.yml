name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: jaugeo-api (Java 17, PostgreSQL 18 via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaugeo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # « sh » : le bit exécutable de mvnw peut manquer quand le dépôt est créé sous Windows
      - run: sh ./mvnw -B verify

  web:
    name: jaugeo-web (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaugeo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jaugeo-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: images Docker de recette (API, front)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jaugeo-api:${{ github.sha }} jaugeo-api
      - run: docker build -t jaugeo-web:${{ github.sha }} jaugeo-web
      # Configuration Nginx valide (l'hôte « api » n'existe que dans le réseau compose)
      - run: docker run --rm --add-host api:127.0.0.1 jaugeo-web:${{ github.sha }} nginx -t
      - name: Compose de recette valide
        working-directory: deploy/recette
        run: >-
          JAUGEO_DOMAINE=recette.example JAUGEO_DB_PASSWORD=x JAUGEO_JWT_SECRET=x JAUGEO_ADMIN_PASSWORD=x
          docker compose config --quiet
