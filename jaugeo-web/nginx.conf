# Nginx du front Jaugeo, derrière le proxy HTTPS (Caddy) : sert l'application et relaie /api vers l'API.
# Même origine pour le navigateur : le cookie de rafraîchissement (SameSite=Strict, HttpOnly) fonctionne sans CORS.
# Les en-têtes de sécurité des pages sont dans entetes-securite.conf ; l'API pose les siens sur ses réponses.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Photos de bordereau et justificatifs : 5 Mo contrôlés par l'API, marge pour l'enveloppe multipart
    client_max_body_size 8m;

    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Santé de l'API pour la supervision (UP ou DOWN, sans détail en profil prod)
    location = /actuator/health {
        access_log off;
        proxy_pass http://api:8080;
    }

    # Documentation de l'API, servie seulement si JAUGEO_API_DOCS=true côté API
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fichiers versionnés par Vite : cache long
    location /assets/ {
        include /etc/nginx/entetes-securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Toute autre route : fichier statique, sinon index.html (application monopage).
    # Pas de cache sur la page d'entrée, le service worker et le manifeste : la tablette reçoit les mises à jour.
    location / {
        include /etc/nginx/entetes-securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
